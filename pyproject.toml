[project]
name = "breastcancer-rep"
version = "0.1.0"
description = "CBIS-DDSM mass (benign vs malignant) mammography pipeline (revival in progress)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Repo authors" }]

# Keep base deps minimal; the legacy scripts bring heavier ML deps.
dependencies = [
  "Pillow>=10.0",
]

[project.optional-dependencies]
analysis = [
  "numpy>=1.24",
  "pandas>=2.0",
]
ml = [
  "torch>=2.1",
  "torchvision>=0.16",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
  "seaborn>=0.13",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]


